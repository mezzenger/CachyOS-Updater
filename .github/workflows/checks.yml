name: checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install test tools
        run: python -m pip install rich ruff
      - name: Unit tests
        run: python -m unittest -v test_cuc.py
      - name: Compile terminal application
        run: python -m py_compile cuc.py cuc_desktop.py cuc_privileged.py
      - name: Static analysis
        run: ruff check cuc.py cuc_privileged.py test_cuc.py
